interface:
  display_name: "Ad Message Maker"
  short_description: "Three ad messages, one photo, built in Figma"
  default_prompt: "Use $ad-message-maker to turn this business into three ad variations in Figma."

dependencies:
  tools:
    - type: "mcp"
      value: "figma-console"
      description: "Figma Console MCP (Desktop Bridge) for creating editable frames"

policy:
  allow_implicit_invocation: true
